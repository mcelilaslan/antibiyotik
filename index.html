<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YBÜ Antibiyotik Rehberi</title>
<meta name="description" content="Yoğun bakımda hızlı erişim için antibiyotik doz, renal ayar, spektrum ve toksisite rehberi.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- ============ LIST VIEW ============ -->
  <div class="list-view" id="listView">
    <header class="header">
      <div class="header-row">
        <div class="title-block">
          <h1>YBÜ Antibiyotik Rehberi</h1>
          <p>Doz · renal ayar · spektrum · toksisite</p>
        </div>
        <button class="icon-btn" id="themeToggle" aria-label="Tema değiştir" title="Tema değiştir">
          <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
          <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="text" inputmode="search" autocomplete="off" placeholder="Etken madde, ticari isim, spektrum ara...">
        <button class="clear-btn" id="clearSearch" aria-label="Aramayı temizle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="chip-row" id="chipRow"></div>
    </header>

    <main class="main">
      <p class="result-count" id="resultCount"></p>
      <div class="legend-note">
        <span class="legend-item"><span class="legend-dot" style="background:var(--risk-low)"></span>Düşük nefrotoksisite</span>
        <span class="legend-item"><span class="legend-dot" style="background:var(--risk-mid)"></span>Orta</span>
        <span class="legend-item"><span class="legend-dot" style="background:var(--risk-high)"></span>Yüksek</span>
      </div>
      <div id="categoryList"></div>
      <div class="empty-state" id="emptyState" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <p>Sonuç bulunamadı. Farklı bir terim deneyin.</p>
      </div>
    </main>

    <p class="footer-note">Klinik karar desteği amaçlı hızlı referanstır; kurum protokolü ve güncel literatür ile birlikte değerlendirilmelidir.</p>
  </div>

  <!-- ============ DETAIL VIEW ============ -->
  <div class="detail" id="detailView">
    <div class="detail-header">
      <button class="back-btn" id="backBtn" aria-label="Geri">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="detail-header-title">
        <p class="h-cat" id="hCat"></p>
        <p class="h-name" id="hName"></p>
      </div>
      <button class="share-btn" id="shareBtn" aria-label="Bağlantıyı paylaş" title="Bağlantıyı kopyala">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-3.9M8.6 13.5l6.8 3.9"/></svg>
      </button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
